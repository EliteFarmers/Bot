overrides:
  # TypeDoc's compiler API integration does not support TypeScript 7 yet.
  typedoc>typescript: ^6.0.3
  # Orval's older Scalar dependency pins an unpatched Undici release.
  undici@7.29.1: ^7.30.1

allowBuilds:
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  bufferutil: true
  esbuild: true
  utf-8-validate: true
  zlib-sync: true

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.6.3'
  - '@biomejs/cli-android-arm64@2.6.3'
  - '@biomejs/cli-android-x64@2.6.3'
  - '@biomejs/cli-darwin-arm64@2.6.3'
  - '@biomejs/cli-darwin-x64@2.6.3'
  - '@biomejs/cli-linux-arm64-musl@2.6.3'
  - '@biomejs/cli-linux-arm64@2.6.3'
  - '@biomejs/cli-linux-x64-musl@2.6.3'
  - '@biomejs/cli-linux-x64@2.6.3'
  - '@biomejs/cli-win32-arm64@2.6.3'
  - '@biomejs/cli-win32-x64@2.6.3'
